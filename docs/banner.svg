<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="1" stop-color="#0b1030"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#e879f9"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.2" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.6" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#6366f1" stroke-opacity="0.12"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <rect width="1280" height="360" fill="url(#glow1)"/>
  <rect width="1280" height="360" fill="url(#glow2)"/>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="80" y="150" font-size="76" font-weight="900" fill="#f8fafc">Pulse<tspan fill="url(#neon)">Form</tspan></text>
    <text x="84" y="205" font-size="28" font-weight="600" fill="#cbd5e1">AI fitness coach that sees every rep.</text>
    <text x="84" y="250" font-size="18" fill="#94a3b8">Webcam pose tracking · live rep counting · form coaching · AI weekly plans</text>
    <g font-size="14" font-weight="600">
      <rect x="84" y="276" rx="14" width="150" height="28" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="104" y="295" fill="#67e8f9">MediaPipe Pose</text>
      <rect x="246" y="276" rx="14" width="132" height="28" fill="#e879f9" fill-opacity="0.12" stroke="#e879f9" stroke-opacity="0.5"/>
      <text x="266" y="295" fill="#f0abfc">Claude AI</text>
      <rect x="390" y="276" rx="14" width="132" height="28" fill="#a3e635" fill-opacity="0.12" stroke="#a3e635" stroke-opacity="0.5"/>
      <text x="410" y="295" fill="#bef264">Next.js 16</text>
    </g>
  </g>
  <!-- neon squat skeleton -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <g stroke="#e879f9" stroke-width="10" opacity="0.5" filter="url(#blur)">
      <path d="M1010 300 L1080 235 L1000 180 L1050 80"/>
    </g>
    <path d="M1010 300 L1080 235 L1000 180" stroke="#e879f9" stroke-width="7"/>
    <path d="M1000 180 L1050 80 L1135 95 L1205 95" stroke="#22d3ee" stroke-width="6"/>
    <path d="M990 305 L1040 307" stroke="#22d3ee" stroke-width="5"/>
    <g fill="#e0f2fe">
      <circle cx="1010" cy="300" r="7"/><circle cx="1080" cy="235" r="9" fill="#e879f9"/><circle cx="1000" cy="180" r="7"/>
      <circle cx="1050" cy="80" r="7"/><circle cx="1135" cy="95" r="6"/><circle cx="1205" cy="95" r="6"/>
      <circle cx="1075" cy="50" r="13" fill="none" stroke="#22d3ee" stroke-width="4"/>
    </g>
    <rect x="1094" y="208" width="58" height="28" rx="6" fill="#020617" fill-opacity="0.8"/>
    <text x="1103" y="228" font-family="ui-monospace, Menlo, monospace" font-size="18" font-weight="700" fill="#e879f9" stroke="none">92°</text>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" text-anchor="end">
    <text x="1200" y="200" font-size="14" fill="#94a3b8" letter-spacing="3">REPS</text>
    <text x="1200" y="250" font-size="44" font-weight="900" fill="#22d3ee">12</text>
  </g>
  <line x1="940" y1="318" x2="1240" y2="318" stroke="#22d3ee" stroke-opacity="0.4"/>
</svg>
